name: Publish

# EKA : un tag eka-N construit l'AAR LGPL et le publie, avec les sources exactes de chaque
# bibliothèque compilée (obligation de la LGPL), dans une release GitHub de ce dépôt public.
on:
  push:
    tags:
      - "eka-*"
      # Les tags eka-mac-N publient la version Mac (publish-macos.yaml).
      - "!eka-mac-*"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip python3-jinja2 gperf nasm
          sudo pip3 install --break-system-packages meson

      - name: Download dependencies
        working-directory: ./buildscripts
        env:
          IN_CI: 1
        run: ./download.sh

      - name: Apply patches
        working-directory: ./buildscripts
        run: ./patch.sh

      - name: Archive corresponding sources (LGPL)
        working-directory: ./buildscripts
        run: |
          tar --exclude-vcs -cJf "$RUNNER_TEMP/eka-libmpv-sources-${GITHUB_REF_NAME}.tar.xz" deps include scripts *.sh $(ls -d patches 2>/dev/null)

      - name: Build
        working-directory: ./buildscripts
        run: ./build.sh

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAR=libmpv/build/outputs/aar/libmpv-release.aar
          cp "$AAR" "eka-libmpv-${GITHUB_REF_NAME}.aar"
          sha256sum "eka-libmpv-${GITHUB_REF_NAME}.aar" > "eka-libmpv-${GITHUB_REF_NAME}.aar.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "eka-libmpv-${GITHUB_REF_NAME}.aar" \
            "eka-libmpv-${GITHUB_REF_NAME}.aar.sha256" \
            "$RUNNER_TEMP/eka-libmpv-sources-${GITHUB_REF_NAME}.tar.xz" \
            --title "eka-libmpv ${GITHUB_REF_NAME}" \
            --notes "libmpv pour EKA Player, construit en LGPL (mpv -Dgpl=false, FFmpeg sans --enable-gpl). Architectures : armeabi-v7a, arm64-v8a. Sources exactes jointes."
